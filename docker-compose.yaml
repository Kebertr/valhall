services:
  postgres-penalty:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_PENALTY}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_PENALTY}"]
      interval: 3s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - penalty-db-data:/var/lib/postgresql/data
    networks:
      - app-network

  postgres-member:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_MEMBER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_MEMBER}"]
      interval: 3s
      retries: 10
    ports:
      - "5434:5432"
    volumes:
      - member-db-data:/var/lib/postgresql/data
    networks:
      - app-network

  postgres-videos:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_VIDEOS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_VIDEOS}"]
      interval: 3s
      retries: 10
    ports:
      - "5435:5432"
    volumes:
      - videos-db-data:/var/lib/postgresql/data
    networks:
      - app-network

  penalty-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: penalty-runtime
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-penalty:5432/${POSTGRES_DB_PENALTY}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      MEMBER_GRPC_URL: member-api:50051
      VIDEO_GRPC_URL: videos-api:50052
    depends_on:
      postgres-penalty:
        condition: service_healthy
      member-api:
        condition: service_started
      videos-api:
        condition: service_started
    networks:
      - app-network

  member-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: member-runtime
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-member:5432/${POSTGRES_DB_MEMBER}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres-member:
        condition: service_healthy
    networks:
      - app-network

  videos-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: videos-runtime
    ports:
      - "3003:3003"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-videos:5432/${POSTGRES_DB_VIDEOS}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      MEMBER_GRPC_URL: member-api:50051
      VIDEO_GRPC_BIND_URL: 0.0.0.0:50052
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_VIDEO_BUCKET: ${MINIO_VIDEO_BUCKET}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      postgres-videos:
        condition: service_healthy
      member-api:
        condition: service_started
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
      args:
        VITE_KEYCLOAK_URL: ${KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
    ports:
      - "5173:80"
    depends_on:
      - penalty-api
      - member-api
      - videos-api
    networks:
      - app-network


volumes:
  penalty-db-data:
  member-db-data:
  videos-db-data:

networks:
  app-network:

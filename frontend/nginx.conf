server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/members {
        proxy_pass http://member-api:3002;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/member {
        proxy_pass http://member-api:3002;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/files {
        proxy_pass http://videos-api:3003;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ {
        proxy_pass http://penalty-api:3001;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
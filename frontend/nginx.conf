server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/members {
        proxy_pass http://member-service;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/member {
        proxy_pass http://member-service;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/files {
        proxy_pass http://video-service;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ {
        proxy_pass http://penalty-service;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
